apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: java-app
spec:
  project: default
  source:
    repoURL: https://github.com/your-username/java-devsecops-pipeline
    path: k8s
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
